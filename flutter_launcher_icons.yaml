# Regenerate with: swift tool/icon/render_icon.swift tool/icon && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#7A1F1F"
  adaptive_icon_foreground: tool/icon/foreground.png
  adaptive_icon_monochrome: tool/icon/monochrome.png
  min_sdk_android: 24
